
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" width="100%" height="100%" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1160" height="650" rx="18" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2" />

  <!-- Header -->
  <rect x="24" y="20" width="1112" height="54" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" />
  <text x="580" y="45" text-anchor="middle" font-size="18" font-weight="800" fill="#171717">SYSTEM BLOCK DIAGRAM & HARDWARE INTERFACING — GROUP 5 (IOT102)</text>
  <text x="580" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#EA580C">Adaptive IoT-UAV Environmental Monitoring System with Downwash-Aware Sensing & LoRa E32 Telemetry</text>

  <!-- ================= LEFT PANEL: TRẠM UAV (ESP32) ================= -->
  <rect x="24" y="92" width="420" height="534" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="24" y="92" width="420" height="40" rx="16" fill="url(#orangeGrad)" />
  <text x="234" y="117" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">1. TRẠM BAY UAV (ESP32 DevKit V1)</text>

  <!-- Power & Mini 360 -->
  <rect x="44" y="148" width="380" height="92" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
  <text x="58" y="168" font-size="13" font-weight="700" fill="#B45309">Hệ thống Nguồn & Mạch hạ áp DC-DC Mini 360</text>
  <text x="58" y="188" font-size="11.5" fill="#171717">• Pin LiPo UAV (+ / -) → Hàn vào IN+ và IN- của Mini 360</text>
  <text x="58" y="206" font-size="11.5" fill="#171717">• OUT+ (Chuẩn 5.0V) → Chân VIN (5V) ESP32 & VCC LoRa E32</text>
  <text x="58" y="224" font-size="11.5" fill="#171717">• OUT- (GND) → Chân GND của ESP32 (Mass chung toàn mạch)</text>

  <!-- BMP280 #1 -->
  <rect x="44" y="254" width="182" height="118" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
  <text x="135" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">BMP280 #1 (Không vỏ)</text>
  <text x="135" y="290" text-anchor="middle" font-size="10.5" font-weight="600" fill="#EA580C">Bus I2C số 0 (Wire)</text>
  <text x="56" y="310" font-size="11" fill="#334155">• VIN → 3V3 (ESP32)</text>
  <text x="56" y="326" font-size="11" fill="#334155">• GND → GND</text>
  <text x="56" y="342" font-size="11" font-weight="600" fill="#0F172A">• SCL → GPIO 22</text>
  <text x="56" y="358" font-size="11" font-weight="600" fill="#0F172A">• SDA → GPIO 21</text>

  <!-- BMP280 #2 -->
  <rect x="242" y="254" width="182" height="118" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <text x="333" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9A3412">BMP280 #2 (Vỏ Pagoda)</text>
  <text x="333" y="290" text-anchor="middle" font-size="10.5" font-weight="600" fill="#EA580C">Bus I2C số 1 (Wire1)</text>
  <text x="254" y="310" font-size="11" fill="#334155">• VIN → 3V3 (ESP32)</text>
  <text x="254" y="326" font-size="11" fill="#334155">• GND → GND</text>
  <text x="254" y="342" font-size="11" font-weight="600" fill="#9A3412">• SCL → GPIO 19</text>
  <text x="254" y="358" font-size="11" font-weight="600" fill="#9A3412">• SDA → GPIO 18</text>

  <!-- ESP32 Core Box -->
  <rect x="44" y="386" width="380" height="82" rx="10" fill="#0F172A" />
  <text x="234" y="408" text-anchor="middle" font-size="13.5" font-weight="800" fill="#FFFFFF">MCU: ESP32 DevKit V1 (Dual-Core 240MHz)</text>
  <text x="234" y="428" text-anchor="middle" font-size="11" fill="#FDBA74">• Dual Hardware I2C (Timeout 50ms) • Hardware Watchdog (15s)</text>
  <text x="234" y="446" text-anchor="middle" font-size="11" fill="#E2E8F0">• ADC1 GPIO 34 (Đo Pin LiPo 3S) • JSON Serializer (ArduinoJson v7)</text>

  <!-- LoRa E32 UAV -->
  <rect x="44" y="482" width="380" height="124" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
  <text x="58" y="502" font-size="13" font-weight="700" fill="#166534">Module LoRa E32-433T20D (Giao tiếp UART2)</text>
  <text x="58" y="522" font-size="11.5" fill="#171717">• VCC → Nguồn 5.0V (từ OUT+ của Mini 360) | GND → GND</text>
  <text x="58" y="540" font-size="11.5" font-weight="600" fill="#14532D">• TXD → GPIO 16 (RX2)  |  RXD → GPIO 17 (TX2)</text>
  <text x="58" y="558" font-size="11.5" fill="#171717">• M0 & M1 → Hàn chập lại và kéo thẳng xuống GND (Mode 0)</text>
  <text x="58" y="576" font-size="11.5" fill="#64748B">• AUX → Bỏ trống (Xử lý chống tràn đệm bằng phần mềm)</text>

  <!-- ================= CENTER: LORA RF LINK ================= -->
  <rect x="466" y="240" width="228" height="230" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2" stroke-dasharray="6,4" />
  <text x="580" y="270" text-anchor="middle" font-size="14" font-weight="800" fill="#EA580C">SÓNG LoRa 433 MHz</text>
  <text x="580" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#737373">9600 bps • 8N1 • Transparent</text>

  <!-- Downlink Arrow -->
  <line x1="450" y1="325" x2="706" y2="325" stroke="#16A34A" stroke-width="3" />
  <polygon points="710,325 698,318 698,332" fill="#16A34A" />
  <text x="580" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">Telemetry JSON + ACK (Downlink)</text>
  <text x="580" y="344" text-anchor="middle" font-size="10" fill="#334155">{seq, t1, p1, t2, p2, bat, vbat, pwr}</text>

  <!-- Uplink Arrow -->
  <line x1="710" y1="405" x2="454" y2="405" stroke="#F97316" stroke-width="3" />
  <polygon points="450,405 462,398 462,412" fill="#F97316" />
  <text x="580" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">Lệnh Điều Khiển 2 Chiều (Uplink)</text>
  <text x="580" y="423" text-anchor="middle" font-size="10" fill="#334155">SPEED_1S | SPEED_5S | SET_FREQ:n</text>
  <text x="580" y="438" text-anchor="middle" font-size="10" fill="#334155">PING | RESET_UAV</text>

  <!-- ================= RIGHT PANEL: TRẠM MẶT ĐẤT & PC ================= -->
  <rect x="716" y="92" width="420" height="534" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="716" y="92" width="420" height="40" rx="16" fill="#0F172A" />
  <text x="926" y="117" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">2. TRẠM MẶT ĐẤT (ESP8266 NodeMCU) & PC</text>

  <!-- Ground Power & USB -->
  <rect x="736" y="148" width="380" height="62" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
  <text x="750" y="168" font-size="13" font-weight="700" fill="#0F172A">Hệ thống Nguồn & Cổng giao tiếp USB Serial</text>
  <text x="750" y="188" font-size="11.5" fill="#334155">• Cáp microUSB 5V cắm trực tiếp từ PC vào board ESP8266</text>
  <text x="750" y="203" font-size="11.5" fill="#334155">• Truyền nhận JSON đồng thời ở tốc độ Baudrate 115200 bps</text>

  <!-- BMP280 #3 Ground -->
  <rect x="736" y="222" width="380" height="92" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <text x="750" y="242" font-size="13" font-weight="700" fill="#9A3412">Cảm biến BMP280 số 3 (Ground Reference - I2C)</text>
  <text x="750" y="262" font-size="11.5" fill="#171717">• VIN → Chân 3V (3.3V) của ESP8266  |  GND → Chân G (GND)</text>
  <text x="750" y="280" font-size="11.5" font-weight="700" fill="#9A3412">• SCL → Chân D6 (GPIO 12)  |  SDA → Chân D5 (GPIO 14)</text>
  <text x="750" y="298" font-size="11" fill="#64748B">• Đo nhiệt độ (t3) & áp suất (p3) đối chứng tại mặt đất</text>

  <!-- LoRa E32 Ground -->
  <rect x="736" y="326" width="380" height="114" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
  <text x="750" y="346" font-size="13" font-weight="700" fill="#166534">Module LoRa E32-433T20D (SoftwareSerial - Buffer 256B)</text>
  <text x="750" y="366" font-size="11.5" fill="#171717">• VCC → Chân VIN (Lấy 5V từ USB)  |  GND → Chân G (GND)</text>
  <text x="750" y="384" font-size="11.5" font-weight="700" fill="#14532D">• TXD → Chân D2 (GPIO 4 - Soft RX) | RXD → Chân D1 (GPIO 5 - Soft TX)</text>
  <text x="750" y="402" font-size="11.5" fill="#171717">• M0 & M1 → Hàn chập lại và kéo xuống G (GND)  |  AUX → Bỏ trống</text>
  <text x="750" y="420" font-size="11" fill="#64748B">• Heartbeat Timeout: Tự động báo "offline" sau 12s mất sóng UAV</text>

  <!-- PC Streamlit & SQLite -->
  <rect x="736" y="454" width="380" height="152" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" />
  <text x="926" y="478" text-anchor="middle" font-size="13.5" font-weight="800" fill="#EA580C">PC GROUND CONTROL STATION (Python 3.11)</text>
  <text x="752" y="500" font-size="11.5" font-weight="600" fill="#171717">1. Backend Gateway (gateway.py):</text>
  <text x="764" y="517" font-size="11" fill="#334155">• Luồng đọc Serial không chặn, kiểm tra Whitelist lệnh điều khiển</text>
  <text x="752" y="537" font-size="11.5" font-weight="600" fill="#171717">2. Cơ sở dữ liệu SQLite (uav_data.db - WAL Mode):</text>
  <text x="764" y="554" font-size="11" fill="#334155">• Lưu bảng readings (13 cột cảm biến) & bảng events theo thời gian thực</text>
  <text x="752" y="574" font-size="11.5" font-weight="600" fill="#171717">3. Giao diện Streamlit (Apple Liquid Glass UI - app.py):</text>
  <text x="764" y="591" font-size="11" fill="#334155">• Biểu đồ Altair trực tiếp + Tính toán tự động PDR, AoI, MAE, RMSE</text>
</svg>
